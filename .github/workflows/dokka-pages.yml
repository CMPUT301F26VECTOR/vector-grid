# Builds the Dokka code documentation (KDoc) and publishes it to GitHub Pages,
# so the wiki can link to it. Runs on every push to main that changes Kotlin
# code or the Gradle setup, and can also be started by hand from the Actions tab.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# The docs are then at https://cmput301f26vector.github.io/vector-grid/
name: Publish Dokka docs

on:
  push:
    branches: [ main ]
    paths:
      - "Project_halfway/app/src/main/**"
      - "Project_halfway/**/*.gradle.kts"
      - "Project_halfway/gradle/**"
      - ".github/workflows/dokka-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one docs deploy at a time; a newer push replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project_halfway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Dokka HTML
        run: ./gradlew :app:dokkaGenerate --no-configuration-cache

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Project_halfway/app/build/dokka/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
